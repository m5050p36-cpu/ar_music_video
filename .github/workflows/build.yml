name: Build Signed Android APK (ARM64)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Upload Signed ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore from Secrets
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.jks
          ls -lh android/keystore/release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../keystore/release.jks
          EOP

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed ARM64 Release APK
        run: flutter build apk --target-platform android-arm64 --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_output
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          cp build/app/outputs/flutter-apk/app-release.apk \
             release_output/ARMusic-v${VERSION}-arm64.apk
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARMusic-ARM64-APK
          path: release_output/ARMusic-v*-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/ARMusic-v*-arm64.apk
          generate_release_notes: true
