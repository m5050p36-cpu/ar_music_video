name: ar_music_video
description: "Professional Audio & Video Player with Supabase Auth and Admin Panel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.16.0
  http: ^1.2.2

  # State
  provider: ^6.1.2

  # Audio
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.15
  audio_video_progress_bar: ^2.0.3
  on_audio_query: ^2.9.0

  # Video
  video_player: ^2.9.2
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.1.1
  screen_brightness: ^2.1.6

  # Storage & Files
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3

  # UI
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1

  # Media Upload (admin only)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Links
  url_launcher: ^6.3.1

dependency_overrides:
  app_links: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
