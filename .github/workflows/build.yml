name: Build Signed Android APK (ARM64)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Upload ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Signing Secrets
        id: sign_check
        run: |
          set +e
          VALID=true
          [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] && echo "❌ KEYSTORE_BASE64" && VALID=false
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && echo "❌ KEYSTORE_PASSWORD" && VALID=false
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && echo "❌ KEY_PASSWORD" && VALID=false
          [ -z "${{ secrets.KEY_ALIAS }}" ] && echo "❌ KEY_ALIAS" && VALID=false
          echo "sign_valid=$VALID" >> $GITHUB_OUTPUT

      - name: Decode & Test Keystore
        if: steps.sign_check.outputs.sign_valid == 'true'
        run: |
          set +e
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.p12 2>/dev/null
          FILE_SIZE=$(stat -c%s android/keystore/release.p12 2>/dev/null || echo 0)
          echo "📦 Keystore size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1500 ]; then
            echo "sign_valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          keytool -list -keystore android/keystore/release.p12 \
            -storetype PKCS12 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            2>&1 | tee /tmp/ks_out.txt
          grep -q "PrivateKeyEntry" /tmp/ks_out.txt || \
            (echo "sign_valid=false" >> $GITHUB_OUTPUT && exit 0)
          echo "✅ Keystore صالح"
          echo "sign_valid=true" >> $GITHUB_OUTPUT

      - name: Create key.properties
        if: steps.sign_check.outputs.sign_valid == 'true'
        run: |
          cat > android/key.properties << EOP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../keystore/release.p12
          storeType=PKCS12
          EOP

      - name: Install Dependencies
        run: flutter pub get

      # ═══════════════════════════════════════════════════════════════
      # ⚠️ إصلاح توافق AGP 8.x مع الإضافات القديمة
      #   1. حذف package="..." من AndroidManifest.xml للإضافات
      #   2. إضافة namespace إلى build.gradle إن لم يكن موجودًا
      # ═══════════════════════════════════════════════════════════════
      - name: Patch legacy plugin manifests
        run: |
          set -e
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "PUB_CACHE_DIR=$PUB_CACHE_DIR"

          # ─── 1. patch مباشر للمسار المعروف ───
          PATCHED=0
          for pkg_dir in on_audio_query_android-*; do
            MANIFEST="$PUB_CACHE_DIR/hosted/pub.dev/${pkg_dir}/android/src/main/AndroidManifest.xml"
            if [ -f "$MANIFEST" ]; then
              echo "📄 Found: $MANIFEST"
              sed -i 's/ package="[^"]*"//g' "$MANIFEST"
              head -3 "$MANIFEST"
              PATCHED=1
            fi
          done

          # ─── 2. patch عام — بدون maxdepth ───
          find "$PUB_CACHE_DIR/hosted/pub.dev" \
            -type f \
            -path "*/android/src/main/AndroidManifest.xml" \
            2>/dev/null | while read -r manifest; do
            if grep -q 'package=' "$manifest" 2>/dev/null; then
              sed -i 's/ package="[^"]*"//g' "$manifest"
              echo "  ✅ patched: $manifest"
            fi
          done

          # ─── 3. تحقق نهائي ───
          echo "════ تحقق نهائي ════"
          FOUND=$(find "$PUB_CACHE_DIR/hosted/pub.dev" \
            -type f \
            -path "*on_audio_query_android*AndroidManifest.xml" \
            2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            if grep -q 'package=' "$FOUND"; then
              echo "❌ لم يُحذف package من $FOUND"
              exit 1
            else
              echo "✅ on_audio_query_android AndroidManifest.xml نظيف"
            fi
          fi

      - name: Build Signed ARM64 APK
        if: steps.sign_check.outputs.sign_valid == 'true'
        run: flutter build apk --target-platform android-arm64 --release

      - name: Build Fallback ARM64 APK
        if: steps.sign_check.outputs.sign_valid != 'true'
        run: flutter build apk --target-platform android-arm64 --release

      - name: Prepare APK
        run: |
          mkdir -p release_output
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "${{ steps.sign_check.outputs.sign_valid }}" = "true" ]; then
            SUFFIX="signed"
          else
            SUFFIX="unsigned"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \
             release_output/ARMusic-v${VERSION}-arm64-${SUFFIX}.apk
          ls -lh release_output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMusic-ARM64-APK
          path: release_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/*.apk
          generate_release_notes: true
